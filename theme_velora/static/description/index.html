<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Theme Velora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>body{font-family:Arial,sans-serif;color:#1a1a1c}.hero{background:#0b0b0c;color:#fff;border-radius:18px;overflow:hidden}.hero img{width:100%;height:420px;object-fit:cover;opacity:.75}.gold{color:#d4af37}.badge-pill{background:#017e84;color:#fff;border-radius:999px;padding:6px 18px}</style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
      <img src="../src/img/logo.png" alt="Velora" style="height:48px"/>
      <div><span class="badge-pill">Community</span> <span class="badge-pill">Enterprise</span></div>
    </div>
    <div class="hero mb-4">
      <img src="../src/img/hero.webp" alt="Velora theme preview"/>
      <div class="p-4"><h1>Theme <span class="gold">Velora</span></h1><p class="mb-0">Luxury perfume eCommerce theme with premium homepage, collections, product cards, testimonials, FAQ, newsletter, cart drawer, and responsive navigation.</p></div>
    </div>
    <img src="../src/img/img1.jpg" class="img-fluid rounded mb-4" alt="Velora about preview"/>
  </div>
</body>
</html>
